    <button class="filter-btn px-3 py-1.5 rounded-full text-sm border border-[var(--rule)] transition" data-filter="刺客列传-重复">刺客列传-重复</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-sm border border-[var(--rule)] transition" data-filter="李斯列传-重复2">李斯列传-重复2</button>

    <p>TRAE AI 创造力大赛 · 社区公益 - 古籍活化工具</p>
  </div>
</footer>

<script>
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
let allIdioms = [];
let currentFilter = 'all';
let searchQuery = '';

function showError(msg) {
  document.getElementById('idiomsList').innerHTML = '<div class="text-center text-[var(--accent)] py-12 col-span-2">' + msg + '</div>';
}

async function loadData() {
  try {
    allIdioms = await fetch('data/idioms.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); });
    render('all');
  } catch (e) {
    console.error(e);
    showError('数据加载失败，请刷新页面重试');
  }
}

function getFilteredIdioms() {
  let list = currentFilter === 'all' ? allIdioms : allIdioms.filter(i => i.source.includes(currentFilter));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(i =>
      i.idiom.includes(q) ||
      (i.meaning && i.meaning.toLowerCase().includes(q)) ||
      (i.story && i.story.toLowerCase().includes(q)) ||
      (i.source && i.source.toLowerCase().includes(q)) ||
      (i.characters && i.characters.some(c => c.includes(q))) ||
      (i.modernUsage && i.modernUsage.toLowerCase().includes(q))
    );
  }
  return list;
}

function render(filter) {
  currentFilter = filter;
  const list = getFilteredIdioms();

  const countEl = document.getElementById('searchCount');
  if (searchQuery) {
    countEl.textContent = `${list.length} 条`;
    countEl.classList.remove('hidden');
  } else {
    countEl.classList.add('hidden');
  }

  document.getElementById('idiomsList').innerHTML = list.length ? list.map((item, idx) => `
    <div class="idiom-card panel p-6 scroll-unfold ${idx < 4 ? 'visible' : ''}" style="transition-delay:${idx * 0.05}s">
      <div class="flex items-start justify-between mb-3">
        <div>
          <h3 class="text-2xl font-bold serif text-[var(--accent)]">${esc(item.idiom)}</h3>
          <p class="text-xs text-[var(--muted)] mt-1">${item.pinyin} · 出自《${item.source}》</p>
        </div>
        <span class="text-3xl opacity-20">📜</span>
      </div>
      <div class="space-y-3 text-sm">
        <div><strong class="text-[var(--muted)]">释义</strong><p>${esc(item.meaning)}</p></div>
        <div><strong class="text-[var(--muted)]">典故</strong><p class="leading-relaxed">${esc(item.story)}</p></div>
        ${item.quote ? `<div class="p-3 bg-[var(--bg2)] rounded-lg border-l-4 border-[var(--accent)]">
          <strong class="text-[var(--muted)] text-xs">史记原文</strong>
          <p class="italic text-[var(--accent)] mt-1 serif vertical-text" style="max-height:200px;overflow:hidden">"${esc(item.quote)}"</p>
        </div>` : ''}
        <div><strong class="text-[var(--muted)]">现代用法</strong><p class="text-[var(--muted)]">${esc(item.modernUsage)}</p></div>
        ${item.characters.length ? `<div class="flex flex-wrap gap-2 pt-2">
          ${item.characters.map(c => `<span class="text-xs px-2 py-1 rounded bg-[var(--accent)]/10 text-[var(--accent)]">${esc(c)}</span>`).join('')}
        </div>` : ''}
      </div>
    </div>
  `).join('') : '<div class="text-center text-[var(--muted)] py-12 col-span-2">未找到匹配的典故</div>';

  // Re-init scroll observer
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  document.querySelectorAll('.scroll-unfold').forEach(el => observer.observe(el));
}

document.getElementById('filterTags').addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active');
      b.style.background = ''; b.style.color = ''; b.style.borderColor = '';
    });
    e.target.classList.add('active');
    e.target.style.background = 'var(--accent)';
    e.target.style.color = '#fff';
    e.target.style.borderColor = 'var(--accent)';
    render(e.target.dataset.filter);
  }
});

// Set initial active style
document.querySelector('.filter-btn.active').style.background = 'var(--accent)';
document.querySelector('.filter-btn.active').style.color = '#fff';
document.querySelector('.filter-btn.active').style.borderColor = 'var(--accent)';

// Filter out "-重复" filter buttons from UI
document.querySelectorAll('#filterTags .filter-btn').forEach(function(btn) {
  var filter = btn.dataset.filter;
  if (filter && filter.endsWith('-重复')) {
    btn.style.display = 'none';
  }
});

// Search
const idiomSearchInput = document.getElementById('idiomSearch');
let searchDebounce;
idiomSearchInput.addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = e.target.value.trim();
    render(currentFilter);
  }, 200);
});

loadData();
</script>
<script src="shortcuts.js"></script>
<script src="theme.js?v=2"></script>
<div id="toast" class="toast"></div>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
