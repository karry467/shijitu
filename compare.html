  // duplicate/extra ids from JSON

// Global data
let allCharacters = [];
let allEvents = [];
let allRelationships = [];
let allIdioms = [];

// Populate selects
async function loadData() {
  try {
    const [characters, events, relationships, idioms] = await Promise.all([
      fetch('data/characters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/events.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/relationships.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/idioms.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; })
    ]);
    allCharacters = characters;
    allEvents = events;
    allRelationships = relationships;
    allIdioms = idioms;
    populateSelects();
  } catch (e) {
    console.error(e);
    const el = document.getElementById('errorMsg');
    if (el) { el.textContent = '数据加载失败，请刷新页面重试'; el.classList.remove('hidden'); }
  }
}

function getChapterLabel(chapter) {
  return chapterNames[chapter] || chapter;
}

function populateSelects() {
  const selA = document.getElementById('selectA');
  const selB = document.getElementById('selectB');

  // Group characters by chapter
  const grouped = {};
  allCharacters.forEach(c => {
    const ch = c.chapter || 'other';
    if (!grouped[ch]) grouped[ch] = [];
    grouped[ch].push(c);
  });

  // Sort chapters by a predefined order (roughly chronological)
  const chapterOrder = ['wudi','xia','yin','zhou','qinshi','qin_benji','xiangyu','gaozu','lvhou',
    'wutaibo','qitaigong','lu','song','wei_kangshu','cai','cao','chenqi','waiqi',
    'jin','chu','zhao','wei','han','yan','tianqi',
    'kongzi','cheshe','liangxiaowang','xiaowen','xiaojing',
    'liuhou','zhangchengxiang','liujing_shusuntong',
    'guanyan','sunwuzi','suqin','zhangyi','baiqiwangjian','shangjun',
    'weigongzi','ranghou','mengchangjun','pingyuanjun','yueyi','lianpo',
    'quyuan_jiasheng','fanju_caize','cike','wuzilie','zhonglishu',
    'huaiyinhou','lisi','lvbuwei','mengtian',
    'jibu_luanbu','yuanang_chaocuo','fengtang','wanshi','tianshu',
    'liguang','weijiangjun','pingjinhou',
    'nanyue','dongyue','chaoxian','xinanyi','dayuanyoushi',
    'youyu','shiji_jingzhong','huozhilie',
    'wuwangbi','weiqi_wuanhou','hanchangru',
    'xiaochu','caoxiangguo','huainan_hengshan_jishan',
    'qianhouchushu','lihai_zhichun',
    'wuzong','sanwang',
    'bianque',
    'hongyan',
    'xiaowu',
    'tai_shi_gong','fengshan_shu','he_shu','pingzhun_shu'
  ];

  const sortedChapters = Object.keys(grouped).sort((a, b) => {
    const ia = chapterOrder.indexOf(a);
    const ib = chapterOrder.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });

  [selA, selB].forEach(sel => {
    sortedChapters.forEach(ch => {
      const label = getChapterLabel(ch);
      if (label.endsWith('-重复')) return;
      const optgroup = document.createElement('optgroup');
      optgroup.label = label;
      grouped[ch].forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name + (c.title ? (' - ' + c.title) : '');
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });
  });

  // Try to read URL params for pre-selection
  const params = new URLSearchParams(window.location.search);
  if (params.get('a')) selA.value = params.get('a');
  if (params.get('b')) selB.value = params.get('b');
  if (selA.value && selB.value) {
    startCompare();
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideError() {
  document.getElementById('errorMsg').classList.add('hidden');
}

function startCompare() {
  hideError();
  const nameA = document.getElementById('selectA').value;
  const nameB = document.getElementById('selectB').value;

  if (!nameA || !nameB) {
    showError('请选择两位人物');
    return;
  }
  if (nameA === nameB) {
    showError('请选择两位不同的人物');
    return;
  }

  const charA = allCharacters.find(c => c.name === nameA);
  const charB = allCharacters.find(c => c.name === nameB);
  if (!charA || !charB) {
    showError('未找到所选人物数据');
    return;
  }

  // Show comparison area
  document.getElementById('comparisonArea').classList.remove('hidden');

  // Update URL params
  const url = new URL(window.location);
  url.searchParams.set('a', nameA);
  url.searchParams.set('b', nameB);
  window.history.replaceState({}, '', url);

  renderHeroCards(charA, charB);
  renderBasicInfo(charA, charB);
  renderTraits(charA, charB);
  renderQuotes(charA, charB);
  renderEvents(charA, charB);
  renderRelationships(charA, charB);
  renderIdioms(charA, charB);

  // Scroll to comparison
  document.getElementById('comparisonArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderHeroCards(a, b) {
  document.getElementById('charAInitial').textContent = a.name.charAt(0);
  document.getElementById('charBInitial').textContent = b.name.charAt(0);
  document.getElementById('charAName').textContent = a.name;
  document.getElementById('charBName').textContent = b.name;
  document.getElementById('charAInfo').textContent = (a.title || a.identity) + ' · ' + (a.lifespan || '');
  document.getElementById('charBInfo').textContent = (b.title || b.identity) + ' · ' + (b.lifespan || '');
  document.getElementById('charADesc').textContent = a.description || '';
  document.getElementById('charBDesc').textContent = b.description || '';
}

function renderBasicInfo(a, b) {
  const fields = [
    { label: '身份', key: 'identity' },
    { label: '称谓', key: 'title' },
    { label: '生卒年', key: 'lifespan' },
    { label: '时期', key: 'period' },
    { label: '字', key: 'courtesyName' }
  ];

  const renderSide = (char) => {
    return fields.map(f => {
      const val = char[f.key];
      if (!val) return '';
      return `<div class="p-3 rounded-lg bg-[var(--bg2)]">
        <div class="section-label">${f.label}</div>
        <div class="text-sm">${esc(val)}</div>
      </div>`;
    }).filter(Boolean).join('');
  };

  document.getElementById('basicInfoA').innerHTML = renderSide(a) || '<p class="text-sm text-[var(--muted)]">暂无数据</p>';
  document.getElementById('basicInfoB').innerHTML = renderSide(b) || '<p class="text-sm text-[var(--muted)]">暂无数据</p>';
}

function renderTraits(a, b) {
  const renderSide = (char) => {
    if (!char.traits || !char.traits.length) return '<p class="text-sm text-[var(--muted)]">暂无数据</p>';
    return char.traits.map(t =>
      `<span class="px-3 py-1 rounded-full text-sm font-medium border border-[var(--accent)]/30 text-[var(--accent)] bg-[var(--accent)]/5">${t}</span>`
    ).join('');
  };
  document.getElementById('traitsA').innerHTML = renderSide(a);
  document.getElementById('traitsB').innerHTML = renderSide(b);
}

function renderQuotes(a, b) {
  const renderSide = (char, side) => {
    if (!char.quotes || !char.quotes.length) return '<p class="text-sm text-[var(--muted)]">暂无名言数据</p>';
    return char.quotes.map(q =>
      `<div class="p-4 rounded-lg bg-[var(--bg2)] border-l-4" style="border-left-color: var(--${side === 'a' ? 'accent' : 'accent2'})">
        <p class="italic text-sm serif leading-relaxed">"${esc(q)}"</p>
        <p class="text-xs text-[var(--muted)] mt-2">-- ${esc(char.name)}</p>
      </div>`
    ).join('');
  };
  document.getElementById('quotesA').innerHTML = renderSide(a, 'a');
  document.getElementById('quotesB').innerHTML = renderSide(b, 'b');
}

function renderEvents(a, b) {
  const nameA = a.name;
  const nameB = b.name;

  // Find events related to either character
  const relEventsA = allEvents.filter(e => e.characters && e.characters.includes(nameA));
  const relEventsB = allEvents.filter(e => e.characters && e.characters.includes(nameB));

  // Find common events (involving both)
  const commonEventIds = new Set(relEventsA.map(e => e.id));
  const commonEvents = relEventsB.filter(e => commonEventIds.has(e.id));

  // Merge all relevant events and deduplicate
  const eventMap = new Map();
  [...relEventsA, ...relEventsB].forEach(e => eventMap.set(e.id, e));
  const allRelEvents = Array.from(eventMap.values()).sort((x, y) => x.year - y.year);

  const eventsArea = document.getElementById('eventsArea');
  if (!allRelEvents.length) {
    eventsArea.innerHTML = '<p class="text-sm text-[var(--muted)] text-center">暂无相关事件数据</p>';
    return;
  }

  eventsArea.innerHTML = allRelEvents.map(e => {
    const inA = e.characters.includes(nameA);
    const inB = e.characters.includes(nameB);
    let badge = '';
    if (inA && inB) {
      badge = `<span class="text-xs px-2 py-0.5 rounded-full bg-[var(--gold)]/20 text-[var(--gold)] font-semibold">双方</span>`;
    } else if (inA) {
      badge = `<span class="text-xs px-2 py-0.5 rounded-full bg-[var(--accent)]/10 text-[var(--accent)] font-semibold">${esc(nameA)}</span>`;
    } else {
      badge = `<span class="text-xs px-2 py-0.5 rounded-full bg-[var(--accent2)]/10 text-[var(--accent2)] font-semibold">${esc(nameB)}</span>`;
    }
    return `<div class="flex items-start gap-3 p-3 rounded-lg bg-[var(--bg2)] mb-2">
      <div class="text-center min-w-[90px] flex-shrink-0">
        <div class="text-xs text-[var(--muted)]">${esc(e.date || '')}</div>
        <div class="mt-1">${badge}</div>
      </div>
      <div class="flex-1">
        <div class="font-bold text-sm">${esc(e.name)}</div>
        <p class="text-sm text-[var(--muted)] mt-1">${esc(e.description)}</p>
      </div>
    </div>`;
  }).join('');
}

function renderRelationships(a, b) {
  const nameA = a.name;
  const nameB = b.name;

  const relsA = allRelationships.filter(r => r.source === nameA || r.target === nameA);
  const relsB = allRelationships.filter(r => r.source === nameB || r.target === nameB);

  // Check if A and B have a direct relationship
  const directRel = allRelationships.find(r =>
    (r.source === nameA && r.target === nameB) || (r.source === nameB && r.target === nameA)
  );

  const renderSide = (rels, charName, otherName) => {
    if (!rels.length) return '<p class="text-sm text-[var(--muted)]">暂无关系数据</p>';

    // Highlight direct relationship if exists
    let html = '';
    if (directRel) {
      const isSource = directRel.source === charName;
      html += `<div class="p-3 rounded-lg border border-[var(--gold)]/40 bg-[var(--gold)]/5">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[var(--gold)]/20 text-[var(--gold)]">直接关系</span>
          <span class="font-bold text-sm">${esc(otherName)}</span>
          <span class="text-xs text-[var(--muted)]">${esc(directRel.type)}</span>
        </div>
        <p class="text-sm text-[var(--muted)] mt-1">${esc(directRel.description)}</p>
      </div>`;
    }

    // Show other relationships (exclude the direct one)
    const otherRels = rels.filter(r => r !== directRel);
    if (otherRels.length) {
      html += '<div class="space-y-2 mt-2">' + otherRels.slice(0, 8).map(r => {
        const isSource = r.source === charName;
        const otherPerson = isSource ? r.target : r.source;
        return `<div class="p-2 rounded-lg bg-[var(--bg2)] text-sm">
          <span class="font-medium">${esc(otherPerson)}</span>
          <span class="text-xs text-[var(--muted)] ml-2">${esc(r.type)}</span>
          <p class="text-xs text-[var(--muted)] mt-1">${esc(r.description)}</p>
        </div>`;
      }).join('') + '</div>';
    }

    return html || '<p class="text-sm text-[var(--muted)]">暂无关系数据</p>';
  };

  document.getElementById('relsA').innerHTML = renderSide(relsA, nameA, nameB);
  document.getElementById('relsB').innerHTML = renderSide(relsB, nameB, nameA);
}

function renderIdioms(a, b) {
  const nameA = a.name;
  const nameB = b.name;

  const idiomsA = allIdioms.filter(id => id.characters && id.characters.includes(nameA));
  const idiomsB = allIdioms.filter(id => id.characters && id.characters.includes(nameB));

  // Check for common idioms
  const idASet = new Set(idiomsA.map(i => i.id));
  const commonIdioms = idiomsB.filter(i => idASet.has(i.id));

  const renderSide = (idioms, side) => {
    if (!idioms.length) return '<p class="text-sm text-[var(--muted)]">暂无典故数据</p>';
    return idioms.slice(0, 8).map(id => {
      const isCommon = commonIdioms.some(ci => ci.id === id.id);
      return `<div class="p-3 rounded-lg bg-[var(--bg2)]">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold serif text-sm">${esc(id.idiom)}</span>
          <span class="text-xs text-[var(--muted)]">${esc(id.source)}</span>
          ${isCommon ? '<span class="text-xs px-2 py-0.5 rounded-full bg-[var(--gold)]/20 text-[var(--gold)]">双方共有</span>' : ''}
        </div>
        <p class="text-xs text-[var(--muted)] mt-2 leading-relaxed">${esc(id.meaning)}</p>
        ${id.story ? `<p class="text-xs text-[var(--muted)] mt-1 leading-relaxed">${esc(id.story.length > 80 ? id.story.substring(0, 80) + '...' : id.story)}</p>` : ''}
      </div>`;
    }).join('');
  };

  document.getElementById('idiomsA').innerHTML = renderSide(idiomsA, 'a');
  document.getElementById('idiomsB').innerHTML = renderSide(idiomsB, 'b');
}

// Initialize
document.addEventListener('DOMContentLoaded', loadData);
</script>
<script src="shortcuts.js"></script>
<script src="theme.js?v=2"></script>
<div id="toast" class="toast"></div>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
