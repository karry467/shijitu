<script>
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
let allData = {};

function showError(msg) {
  const statsRow = document.getElementById('statsRow');
  if (statsRow) statsRow.innerHTML = '<div class="col-span-full text-center text-[var(--accent)] py-8">' + msg + '</div>';
}

async function loadData() {
  try {
    const [chapters, characters, events, locations, relationships] = await Promise.all([
      fetch('data/chapters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/characters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/events.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/locations.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/relationships.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; })
    ]);
    allData = { chapters, characters, events, locations, relationships };
    // Filter out "-重复" chapters from display data
    var dupIds = new Set();
    allData.chapters.forEach(function(ch) {
      if (ch.title && ch.title.endsWith('-重复')) dupIds.add(ch.id);
    });
    if (dupIds.size > 0) {
      allData.characters = allData.characters.filter(function(c) { return !dupIds.has(c.chapter); });
      allData.events = allData.events.filter(function(e) { return !dupIds.has(e.chapter); });
      allData.locations = allData.locations.filter(function(l) { return !dupIds.has(l.chapter); });
      allData.chapters = allData.chapters.filter(function(ch) { return !dupIds.has(ch.id); });
    }
    renderStats();
    renderCharts();
    renderPeriodDonut();
    renderDashMap();
    renderRanking();
    renderEventTable();
  } catch (e) {
    console.error(e);
    showError('数据加载失败，请刷新页面重试');
  }
}

function renderStats() {
  const stats = [
    { label: '篇章', value: allData.chapters.length, color: 'var(--ink)', icon: '📖' },
    { label: '人物', value: allData.characters.length, color: 'var(--accent)', icon: '👤' },
    { label: '事件', value: allData.events.length, color: 'var(--accent2)', icon: '⚔️' },
    { label: '地点', value: allData.locations.length, color: 'var(--gold)', icon: '📍' },
    { label: '关系', value: allData.relationships.length, color: '#7A6A8E', icon: '🔗' }
  ];
  document.getElementById('statsRow').innerHTML = stats.map(s => `
    <div class="stat-card panel p-5 text-center">
      <div class="text-2xl mb-1">${s.icon}</div>
      <div class="text-3xl font-bold serif" style="color:${s.color}">${s.value}</div>
      <div class="text-xs text-[var(--muted)] mt-1">${s.label}</div>
    </div>
  `).join('');
}

  const chartSplitLineColor = isDark ? '#2a2520' : '#eee';

    xAxis: { type: 'category', data: orderedChapters.map(ch => dashChapterNames[ch]), axisLabel: { fontFamily: 'Noto Serif SC', fontSize: 10, rotate: 30, color: chartTextColor }, axisLine: { lineStyle: { color: chartAxisColor } } },

  const relChart = echarts.init(document.getElementById('relTypePie'));
  const relTypes = {};
  allData.relationships.forEach(r => { relTypes[r.type] = (relTypes[r.type] || 0) + 1; });
  const relData = Object.entries(relTypes)
    .map(([name, value]) => ({ name, value }))
    .sort((a, b) => b.value - a.value);
  const relColors = ['#B4462A', '#5B7B5A', '#C8A24E', '#7A6A8E', '#4A90D9', '#D4764E', '#6B8E6B', '#8B6914', '#2E8B57', '#CD7F32', '#4169E1', '#6A5ACD', '#20B2AA', '#3CB371', '#228B22', '#696969', '#4a4a4a'];
  relChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: chartTooltipBg, borderColor: chartTooltipBorder, textStyle: { color: chartTextColor } },
    grid: { left: 60, right: 30, top: 20, bottom: 20 },
    xAxis: { type: 'value', minInterval: 1, axisLabel: { color: chartTextColor }, axisLine: { lineStyle: { color: chartAxisColor } }, splitLine: { lineStyle: { color: chartSplitLineColor } } },
    yAxis: { type: 'category', data: relData.map(d => d.name), axisLabel: { fontFamily: 'Noto Serif SC', fontSize: 11, color: chartTextColor }, axisLine: { lineStyle: { color: chartAxisColor } } },
    series: [{
      type: 'bar',
      data: relData.map((d, i) => ({ value: d.value, itemStyle: { color: relColors[i % relColors.length], borderRadius: [0, 4, 4, 0] } })),
      barWidth: '60%',
      label: { show: true, position: 'right', fontSize: 12, fontFamily: 'Noto Serif SC', color: chartTextColor }
    }]
  });

  window.addEventListener('resize', () => {
    charChart.resize(); relChart.resize();
  });
}

function renderPeriodDonut() {
  const periodChart = echarts.init(document.getElementById('periodPie'));
  const periodCounts = {};
  allData.chapters.forEach(ch => {
    periodCounts[ch.period] = (periodCounts[ch.period] || 0) + 1;
  });

  const periodData = Object.entries(periodCounts)
    .sort((a, b) => b[1] - a[1]);

  const periodColors = [
    '#B4462A', '#5B7B5A', '#C8A24E', '#8B7E6A', '#7A6A8E', '#4A90D9',
    '#D4764E', '#6B8E6B', '#8B6914', '#2E8B57', '#CD7F32', '#4169E1',
    '#6A5ACD', '#20B2AA', '#3CB371', '#228B22', '#708090', '#FF8C00',
    '#A0522D', '#CD853F', '#DAA520', '#4682B4', '#8B008B', '#FF6347',
    '#006400', '#A52A2A', '#483D8B', '#008080'
  ];

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#E8E0D4' : '#2C2416';

  periodChart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: p => `${p.name}<br/>${p.value} 篇 (${p.percent}%)`
    },
    legend: {
      type: 'scroll',
      orient: 'vertical',
      right: 10,
      top: 20,
      bottom: 20,
      textStyle: { fontFamily: 'Noto Serif SC', fontSize: 11, color: textColor },
      formatter: name => {
        const item = periodData.find(d => d[0] === name);
        return name + ' (' + (item ? item[1] : '') + ')';
      }
    },
    color: periodColors,
    series: [{
      type: 'pie',
      radius: ['35%', '65%'],
      center: ['35%', '50%'],
      avoidLabelOverlap: true,
      itemStyle: {
        borderRadius: 6,
        borderColor: isDark ? '#1a1814' : '#F8F4EC',
        borderWidth: 2
      },
      label: {
        show: true,
        formatter: '{b}\n{d}%',
        fontFamily: 'Noto Serif SC',
        fontSize: 10,
        color: textColor
      },
      labelLine: {
        lineStyle: { color: isDark ? '#3a3530' : '#DDD2C0' }
      },
      emphasis: {
        label: { show: true, fontSize: 13, fontWeight: 'bold' },
        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
      },
      data: periodData.map(d => ({ name: d[0], value: d[1] }))
    }]
  });

  window.addEventListener('resize', () => { periodChart.resize(); });
}

let dashMapInstance = null;
function renderDashMap() {
  if (dashMapInstance) { dashMapInstance.remove(); dashMapInstance = null; }

  dashMapInstance = L.map('dashMap').setView([35.0, 110.0], 5);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'],
    attribution: '高德地图',
    maxZoom: 18
  }).addTo(dashMapInstance);

  // Count events per location
  const locEventCount = {};
  allData.locations.forEach(loc => {
    const relatedEvents = allData.events.filter(e => e.locationId === loc.id);
    locEventCount[loc.id] = relatedEvents.length;
  });
  const maxEvents = Math.max(...Object.values(locEventCount), 1);

  const coordCounts = {};
  allData.locations.forEach(loc => {
    const key = `${loc.lat.toFixed(3)},${loc.lng.toFixed(3)}`;
    const count = coordCounts[key] || 0;
    coordCounts[key] = count + 1;

    let lat = loc.lat, lng = loc.lng;
    if (count > 0) {
      const angle = count * 0.8;
      const radius = 0.03 * Math.sqrt(count);
      lat += radius * Math.cos(angle);
      lng += radius * Math.sin(angle) / Math.cos(lat * Math.PI / 180);
    }

    const eventCount = locEventCount[loc.id] || 0;
    const baseRadius = 6;
    const scaledRadius = baseRadius + (eventCount / maxEvents) * 14;

    const color = dashChapterColors[loc.chapter] || '#8B7E6A';
    const marker = L.circleMarker([lat, lng], {
      radius: scaledRadius,
      fillColor: color,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.7
    }).addTo(dashMapInstance);

    const relatedEvents = allData.events.filter(e => e.locationId === loc.id);
    const popup = `
      <div class="min-w-[180px]">
        <h3 class="font-bold serif text-base mb-1" style="color:${color}">${loc.name}</h3>
        <p class="text-xs mb-2" style="color:var(--muted)">今：${loc.modernName}</p>
        <p class="text-sm mb-2" style="color:var(--ink)">${loc.description}</p>
        <div class="text-xs mb-1" style="color:var(--muted)">相关事件 (${eventCount})：</div>
        <div class="space-y-1 mt-1">
          ${relatedEvents.map(e => `<div class="text-sm font-medium" style="color:var(--ink)">${e.date} · ${e.name}</div>`).join('')}
        </div>
        <a href="detail.html?type=location&id=${loc.id}" class="inline-block mt-2 text-xs px-2 py-1 rounded" style="background:${color};color:#fff;text-decoration:none">查看详情</a>
      </div>
    `;
    marker.bindPopup(popup);
    marker.on('click', () => { /* popup auto-opens */ });
  });

  // fitBounds
  const bounds = [];
  allData.locations.forEach(loc => {
    if (loc.lat && loc.lng) bounds.push([loc.lat, loc.lng]);
  });
  if (bounds.length) {
    dashMapInstance.fitBounds(bounds, { pad: [20, 20] });
  }
}

function renderRanking() {
  const charRelCount = {};
  allData.characters.forEach(c => { charRelCount[c.name] = { count: 0, id: c.id, chapter: c.chapter }; });
  allData.relationships.forEach(r => {
    if (charRelCount[r.source]) charRelCount[r.source].count++;
    if (charRelCount[r.target]) charRelCount[r.target].count++;
  });
  const sorted = Object.entries(charRelCount).sort((a, b) => b[1].count - a[1].count);
  const maxCount = sorted[0]?.[1].count || 1;

  document.getElementById('charRanking').innerHTML = sorted.map(([name, info], i) => {
    const pct = (info.count / maxCount * 100).toFixed(0);
    const color = info.chapter === 'xiangyu' ? 'var(--accent)' : 'var(--accent2)';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `<span class="text-[var(--muted)]">${i+1}</span>`;
    return `
      <div class="flex items-center gap-4">
        <div class="w-8 text-center text-sm">${medal}</div>
        <div class="flex-1">
          <div class="flex justify-between mb-1">
            <a href="detail.html?type=character&id=${info.id}" class="font-medium text-sm hover:text-[var(--accent)]">${esc(name)}</a>
            <span class="text-xs text-[var(--muted)]">${info.count} 个关系</span>
          </div>
          <div class="h-2 rounded-full bg-[var(--bg2)]">
            <div class="h-full rounded-full transition-all duration-1000" style="width:${pct}%;background:${color}"></div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderEventTable() {
  const sorted = [...allData.events].sort((a, b) => a.year - b.year);
  document.getElementById('eventTable').innerHTML = sorted.map(e => `
    <tr class="border-b border-[var(--rule)] hover:bg-[var(--bg2)] transition cursor-pointer" onclick="location.href='detail.html?type=event&id=${e.id}'">
      <td class="py-3 px-4 font-medium text-[var(--accent)] whitespace-nowrap">${esc(e.date)}</td>
      <td class="py-3 px-4 font-medium">${esc(e.name)}</td>
      <td class="py-3 px-4"><span class="text-xs px-2 py-0.5 rounded" style="background:${dashChapterColors[e.chapter]}20;color:${dashChapterColors[e.chapter]}">${dashChapterNames[e.chapter] || e.chapter}</span></td>
      <td class="py-3 px-4 text-[var(--muted)]">${esc(e.locationName)}</td>
      <td class="py-3 px-4"><div class="flex flex-wrap gap-1">${e.characters.map(c => `<span class="text-xs px-1.5 py-0.5 rounded bg-[var(--bg2)]">${esc(c)}</span>`).join('')}</div></td>
      <td class="py-3 px-4 text-xs text-[var(--muted)] max-w-[200px]">${esc(e.significance)}</td>
    </tr>
  `).join('');
}

loadData();

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;

}
