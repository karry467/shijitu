<script>
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
let allData = {}, chart, currentFilter = 'all', currentChapter = 'all';

function showError(msg) {
  document.getElementById('graphChart').innerHTML = '<div class="text-center text-[var(--accent)] py-20">' + msg + '</div>';
}

async function loadData() {
  try {
    const [characters, relationships] = await Promise.all([
      fetch('data/characters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/relationships.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; })
    ]);
    allData = { characters, relationships };

    const params = new URLSearchParams(location.search);
    const ch = params.get('chapter') || localStorage.getItem('selectedChapter') || 'all';
    currentChapter = ch;
    document.getElementById('chapterSelect').value = ch;
    document.getElementById('compareLink').style.display = (ch === 'xiangyu' || ch === 'gaozu') ? 'inline-flex' : 'none';

    initChart();
    render();

    // Filter dropdown: hide chapters with zero characters
    document.querySelectorAll('#chapterSelect option').forEach(function(opt) {
      if (opt.value === 'all') return;
      var chChars = allData.characters.filter(function(c) { return c.chapter === opt.value; });
      if (chChars.length === 0) opt.style.display = 'none';
    });

    // Support char param from timeline.html viewChar()
    const charParam = params.get('char');
    if (charParam) {
      setTimeout(function() {
        chart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: charParam });
        chart.dispatchAction({ type: 'showTip', seriesIndex: 0, name: charParam });
        // Also show the detail panel for this character
        showDetail(charParam);
      }, 500);
    }
  } catch (e) {
    console.error(e);
    showError('数据加载失败，请刷新页面重试');
  }
}

function initChart() {
  chart = echarts.init(document.getElementById('graphChart'));
  chart.on('click', params => {
    if (params.dataType === 'node') showDetail(params.data.id);
  });
  window.addEventListener('resize', () => chart.resize());
}

function getFilteredData() {
  let chars = allData.characters;
  let rels = allData.relationships;

  if (currentChapter !== 'all') {
    // Core: characters in selected chapter
    const coreNames = new Set(chars.filter(c => c.chapter === currentChapter).map(c => c.name));
    // Connected: characters related to core (cross-chapter)
    const connectedNames = new Set(coreNames);
    rels.forEach(r => {
      if (coreNames.has(r.source)) connectedNames.add(r.target);
      if (coreNames.has(r.target)) connectedNames.add(r.source);
    });
    chars = chars.filter(c => connectedNames.has(c.name));
    rels = rels.filter(r => connectedNames.has(r.source) && connectedNames.has(r.target));
  }

  if (currentFilter !== 'all') rels = rels.filter(r => r.type === currentFilter);

  return { chars, rels };
}

function render() {
  const { chars, rels } = getFilteredData();
  window.graphColorMap = { wudi: '#8B6914', xia: '#B8860B', yin: '#CD7F32', zhou: '#2E8B57', kongzi: '#20B2AA', cike: '#3CB371', lianpo: '#228B22', wuyue: '#8B4513', shangjun: '#4A6741', weigongzi: '#6B4226', qinshi: '#4a4a4a', cheshe: '#696969', xiangyu: '#B4462A', gaozu: '#4169E1', lvhou: '#6A5ACD', liguang: '#4A6FA5', qitaigong: '#2F4F4F', guanyan: '#556B2F', liuhou: '#4682B4', huaiyinhou: '#8B008B', lu: '#8B0000', jin: '#800080', chu: '#006400', zhao: '#FF8C00', sunwuzi: '#8B5A2B', baiqiwangjian: '#A0522D', suqin: '#CD853F', zhangyi: '#DAA520', mengzi_xunzi: '#6B8E23', xiongnu: '#708090', lisi: '#5F9EA0', mengtian: '#008B8B', wei: '#8B4513', han: '#A52A2A', yan: '#483D8B', tianqi: '#008080', wutaibo: '#800000', zheng: '#D2691E', song: '#B22222', wei_kangshu: '#9932CC', fanju_caize: '#6495ED', yueyi: '#DC143C', quyuan_jiasheng: '#1E90FF', lvbuwei: '#FF6347', qin_benji: '#4B0082', cai: '#9400D3', cao: '#FF1493', chenqi: '#00CED1', waiqi: '#FF4500', ranghou: '#7FFFD4', mengchangjun: '#F0E68C', pingyuanjun: '#DDA0DD', chunshenjun: '#98FB98', tiandan: '#F4A460', luzhonglian: '#87CEEB', lisheng_lujia: '#FFB6C1', zhangchengxiang: '#B0C4DE', liujing_shusuntong: '#FFD700', yuanang_chaocuo: '#FF69B4' , xiaowen: '#556B2F', xiaojing: '#8FBC8F', xiaowu: '#CD5C5C', liangxiaowang: '#DEB887', wuzong: '#D2B48C', sanwang: '#BC8F8F', jibu_luanbu: '#778899', fengtang: '#708090', wanshi: '#BDB76B', tianshu: '#8B8378', bianque: '#20B2AA', wuwangbi: '#CD5C5C', weiqi_wuanhou: '#9370DB', hanchangru: '#6B8E23', weijiangjun: '#B22222', pingjinhou: '#A0522D', nanyue: '#2E8B57', dongyue: '#3CB371', chaoxian: '#4682B4', xinanyi: '#5F9EA0', xiaochu: '#2F4F4F', caoxiangguo: '#556B2F', huainan_hengshan_jishan: '#8B008B', qianhouchushu: '#698B22', lihai_zhichun: '#8B0000', dayuanyoushi: '#B8860B', youyu: '#A52A2A', hongyan: '#CD5C5C', shiji_jingzhong: '#20B2AA', rizhualie: '#778899', huozhilie: '#DAA520', wuzilie: '#4169E1', zhonglishu: '#228B22', meigeng: '#708090'
, heiqi_juliang_lie: '#A0522D', mengchang_lie: '#F0E68C', pingyuan_lie: '#DDA0DD', chunshen_lie: '#98FB98', fan_ju_lie: '#6495ED', yueyi_lie: '#DC143C', lian_po_lin_xiangru_lie: '#228B22', tian_dan_lie: '#F4A460', lu_zhonglian_lie: '#87CEEB', li_jia_shu: '#FFB6C1', liang_qi_lie: '#FFD700', quyuan_jiasheng_lie: '#1E90FF', lv_buwei_lie: '#FF6347', ci_ke_lie: '#3CB371', li_silie: '#5F9EA0', meng_tian_lie: '#008B8B', peng_yue_lie: '#8B4513', ying_bu_lie: '#A52A2A', huaiyin_hou_lie: '#8B008B', xin_qi_lie: '#6B4226', yue_wang_goujian_lie: '#8B4513', zheng_shi_lie: '#B0C4DE', yuan_ang_chao_cuo_lie: '#FF69B4', banyuan_lie: '#20B2AA', wu_wang_bi_lie: '#CD5C5C', weiqi_wuanhou_lie: '#9370DB', li_ji_lian_po_lie: '#4A6FA5', huo_zhi_lie: '#DAA520', tai_shi_gong: '#800080', he_shu: '#4682B4', pingzhun_shu: '#2E8B57', fengshan_shu: '#CD7F32'
};
  const colorMap = window.graphColorMap;

  const nodes = chars.map(c => ({
    id: c.name,
    name: c.name,
    symbolSize: 30 + (rels.filter(r => r.source === c.name || r.target === c.name).length * 5),
    itemStyle: { color: colorMap[c.chapter] || '#8B7E6A' },
    label: { show: true, fontSize: 13, fontFamily: 'Noto Serif SC', fontWeight: 'bold' }
  }));

  const links = rels.map(r => ({
    source: r.source,
    target: r.target,
    value: r.type,
    lineStyle: { width: 2, curveness: 0.2 }
  }));

  const categories = [...new Set(rels.map(r => r.type))];
  const nodeCount = nodes.length;
  const repulsion = Math.max(400, nodeCount * 15);
  const gravity = nodeCount > 20 ? 0.05 : 0.1;

  chart.setOption({
    tooltip: {
      formatter: p => {
        if (p.dataType === 'edge') return `${p.data.source} → ${p.data.target}<br/><strong>${p.data.value}</strong>`;
        const c = chars.find(x => x.name === p.data.name);
        if (!c) return p.data.name;
        return `<strong style="font-size:14px">${c.name}</strong>` +
          (c.title || c.identity ? `<br/><span style="color:#8B7E6A">${c.title || ''} ${c.identity || ''}</span>` : '') +
          (c.lifespan ? `<br/>${c.lifespan}` : '') +
          (c.description ? `<br/><span style="font-size:12px;display:inline-block;margin-top:4px;max-width:260px">${c.description.substring(0, 60)}${c.description.length > 60 ? '...' : ''}</span>` : '') +
          (c.quotes && c.quotes.length ? `<br/><span style="font-size:11px;color:#B4462A;font-style:italic">"${c.quotes[0].substring(0, 30)}${c.quotes[0].length > 30 ? '...' : ''}"</span>` : '');
      }
    },
    legend: { show: false },
    series: [{
      type: 'graph',
      layout: 'force',
      data: nodes,
      links: links,
      categories: categories.map(cat => ({ name: cat })),
      roam: true,
      draggable: true,
      label: { show: true, position: 'bottom' },
      force: { repulsion: repulsion, edgeLength: [60, 160], gravity: gravity },
      emphasis: {
        focus: 'adjacency',
        lineStyle: { width: 4 }
      },
      animationDurationUpdate: 500,
      animationEasingUpdate: 'quinticInOut'
    }]
  }, true);
}

function showDetail(name) {
  const c = allData.characters.find(x => x.name === name);
  if (!c) return;
  document.getElementById('emptyPanel').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('detailName').innerHTML = `${esc(c.name)} <span class="text-sm font-normal text-[var(--muted)]">${esc(c.title || c.identity)}</span>`;

  const rels = allData.relationships.filter(r => r.source === name || r.target === name);
  document.getElementById('detailContent').innerHTML = `
    <div><strong class="text-[var(--muted)]">生卒年</strong><p>${esc(c.lifespan)}</p></div>
    <div><strong class="text-[var(--muted)]">身份</strong><p>${esc(c.identity)}</p></div>
    <div><strong class="text-[var(--muted)]">性格特点</strong><div class="flex flex-wrap gap-2 mt-1">${c.traits.map(t => `<span class="px-2 py-0.5 rounded bg-[var(--bg2)] text-xs">${esc(t)}</span>`).join('')}</div></div>
    <div><strong class="text-[var(--muted)]">简介</strong><p class="leading-relaxed mt-1">${esc(c.description)}</p></div>
    ${c.quotes.length ? `<div><strong class="text-[var(--muted)]">经典名言 <span class="text-xs">(史记原文)</span></strong><div class="mt-1 space-y-1 italic text-[var(--accent)]">${c.quotes.map(q => `<p>"${esc(q)}"</p>`).join('')}</div></div>` : ''}
    <div><strong class="text-[var(--muted)]">人物关系</strong><div class="mt-1 space-y-1">${rels.map(r => {
      const other = r.source === name ? r.target : r.source;
      return `<div class="flex items-center gap-2"><span class="text-xs px-2 py-0.5 rounded bg-[var(--accent)]/10 text-[var(--accent)]">${esc(r.type)}</span><span>${esc(other)}</span><span class="text-[var(--muted)] text-xs">${esc(r.description)}</span></div>`;
    }).join('')}</div></div>
    <a href="detail.html?type=character&id=${c.id}" class="mt-3 block text-center px-4 py-2 rounded-lg bg-[var(--accent)] text-white text-sm font-medium hover:bg-[#9a3a22] transition">查看完整详情</a>
  `;
}

document.getElementById('chapterSelect').addEventListener('change', e => {
  currentChapter = e.target.value;
  document.getElementById('compareLink').style.display = (currentChapter === 'xiangyu' || currentChapter === 'gaozu') ? 'inline-flex' : 'none';
  render();
});

document.getElementById('relationFilters').addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.type;
    render();
  }
});

// Filter out "-重复" options from dropdown
document.querySelectorAll('#chapterSelect option').forEach(function(opt) {
  if (opt.value !== 'all' && opt.textContent.endsWith('-重复')) {
    opt.style.display = 'none';
  }
});

// Build full legend from chapterSelect dropdown entries
(function buildLegend() {
  var legendEl = document.getElementById('legendList');
  var html = '';
  var cm = window.graphColorMap || {};
  document.querySelectorAll('#chapterSelect option').forEach(function(opt) {
    if (opt.value === 'all' || opt.style.display === 'none') return;
    html += '<div class="flex items-center"><span class="relation-legend" style="background:' + (cm[opt.value] || '#8B7E6A') + '"></span>' + opt.textContent + '</div>';
  });
  legendEl.innerHTML = html;
})();

loadData();
</script>
<script src="shortcuts.js"></script>
<script src="theme.js?v=2"></script>
<div id="toast" class="toast"></div>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
