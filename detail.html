  .section-title { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 1rem; transition: all 0.2s; }
  .card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .chapter-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 500; border: 1px solid; }
  .chapter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .timeline-event { position: relative; padding-left: 1.5rem; border-left: 2px solid var(--rule); }
  .timeline-event::before { content: ''; position: absolute; left: -5px; top: 0.5rem; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .breadcrumb { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--muted); }

  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb span { color: var(--ink); }
  .quote-block { position: relative; padding: 1rem 1.5rem; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--accent); }

  .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

}

let allData = {};

function showError(msg) {
  document.getElementById('content').innerHTML = '<div class="text-center text-[var(--accent)] py-20"><div class="text-lg font-bold mb-2">加载失败</div><div class="text-sm">' + msg + '</div><button onclick="location.reload()" class="mt-4 px-4 py-2 rounded-lg bg-[var(--accent)] text-white text-sm">刷新页面</button></div>';
}

async function loadData() {
  // Hide default placeholder immediately if valid URL params exist (prevent flash)
  var params = new URLSearchParams(window.location.search);
  var type = params.get('type');
  var id = params.get('id');
  var name = params.get('name');
  if ((type && id) || (type === 'idiom' && name)) {
    var contentEl = document.getElementById('content');
    if (contentEl) contentEl.innerHTML = '';
  }

  try {
    const [characters, events, locations, relationships, chapters, idioms] = await Promise.all([
      fetch('data/characters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/events.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/locations.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/relationships.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/chapters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/idioms.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; })
    ]);
    allData = { characters, events, locations, relationships, chapters, idioms };

    const params = new URLSearchParams(location.search);
    const type = params.get('type');
    const id = params.get('id');
    const name = params.get('name');

    if (type === 'character' && id) renderCharacter(id);
    else if (type === 'event' && id) renderEvent(id);
    else if (type === 'location' && id) renderLocation(id);
    else if (type === 'idiom' && name) renderIdiom(name);
    else document.getElementById('content').innerHTML = '<div class="text-center text-[var(--muted)] py-20">请选择要查看的内容</div>';
  } catch (e) {
    console.error(e);
    showError('数据加载失败，请刷新页面重试');
  }
}

function getChapterInfo(characterName) {
  // Find chapter where this character is listed
  const ch = allData.chapters.find(c => c.characters.includes(characterName));
  if (!ch) return null;
  return {
    id: ch.id,
    title: ch.title,
    period: ch.period,
    color: chapterColorMap[ch.id] || '#888',
    timeRange: ch.timeRange || ''
  };
}

function getCharacterIdioms(name) {
  return allData.idioms.filter(i => i.characters.includes(name));
}

function getCharacterEvents(name) {
  return allData.events.filter(e => e.characters.includes(name));
}

function getEventChapter(event) {
  return allData.chapters.find(c => c.events && c.events.includes(event.name));
}

function buildBreadcrumb(items) {
  // items: [{label, href?}]
  let html = items.map((item, idx) => {
    if (idx === items.length - 1) return `<span>${esc(item.label)}</span>`;
    return `<a href="${item.href}">${item.label}</a><span style="color:var(--rule)">/</span>`;
  }).join('');
  document.getElementById('breadcrumb').innerHTML = html;
}

function renderLifeTimeline(charName, evs) {
  if (evs.length === 0) return '';

  // Parse dates to sort
  const sorted = evs.slice().sort((a, b) => {
    const ya = parseYear(a.date), yb = parseYear(b.date);
    return ya - yb;
  }).slice(0, 15); // Max 15 events

  // Use ECharts for a horizontal timeline
  const categories = sorted.map(e => e.name);
  const years = sorted.map(e => parseYear(e.date));

  // Build simple vertical timeline HTML instead (no ECharts dependency to keep it light)
  let html = '<div class="space-y-4 mt-2">';
  sorted.forEach((e, i) => {
    html += `
      <div class="timeline-event pb-4">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-mono text-[var(--muted)]">${esc(e.date)}</span>
        </div>
        <a href="detail.html?type=event&id=${e.id}" class="font-medium hover:text-[var(--accent)] transition">${esc(e.name)}</a>
        <p class="text-sm text-[var(--muted)] mt-1">${esc(e.description.substring(0, 80))}${e.description.length > 80 ? '...' : ''}</p>
      </div>`;
  });
  html += '</div>';
  return html;
}

function parseYear(dateStr) {
  if (!dateStr) return -9999;
  const m = dateStr.match(/(-?\d+)/);
  return m ? parseInt(m[1]) : -9999;
}

function renderCharacter(id) {
  const c = allData.characters.find(x => x.id === id);
  if (!c) return;

  const rels = allData.relationships.filter(r => r.source === c.name || r.target === c.name);
  const evs = getCharacterEvents(c.name);
  const chapterInfo = getChapterInfo(c.name);
  const idioms = getCharacterIdioms(c.name);

  // Build stats
  const stats = [
    { num: rels.length, label: '人物关系' },
    { num: evs.length, label: '参与事件' },
    { num: idioms.length, label: '相关典故' }
  ];

  buildBreadcrumb([
    { label: '首页', href: 'index.html' },
    { label: '人物关系', href: 'graph.html' },
    { label: c.name }
  ]);

  document.getElementById('content').innerHTML = `
    <!-- Hero Section -->
    <div class="panel p-8 mb-6">
      <div class="hero-grid" style="display:grid;grid-template-columns:1fr 280px;gap:2rem;">
        <!-- Left: Main Info -->
        <div>
          <div class="flex items-center gap-3 mb-2 flex-wrap">
            <h1 class="text-3xl font-bold serif">${esc(c.name)}</h1>
            ${c.courtesyName ? `<span class="text-sm text-[var(--muted)]">字 ${esc(c.courtesyName)}</span>` : ''}
          </div>
          ${chapterInfo ? `
          <div class="mb-4">
            <span class="chapter-badge" style="color:${chapterInfo.color};border-color:${chapterInfo.color}33;background:${chapterInfo.color}11">
              <span class="chapter-dot" style="background:${chapterInfo.color}"></span>
              ${chapterInfo.title}
            </span>
            <span class="text-xs text-[var(--muted)] ml-2">${chapterInfo.timeRange}</span>
          </div>` : ''}
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <div class="section-title">生卒年</div>
              <p class="text-base">${esc(c.lifespan || '不详')}</p>
            </div>
            <div>
              <div class="section-title">身份</div>
              <p class="text-base">${esc(c.identity || '不详')}</p>
            </div>
          </div>
          <div class="mb-4">
            <div class="section-title">性格特点</div>
            <div class="flex flex-wrap gap-2 mt-1">
              ${c.traits.map(t => `<span class="px-3 py-1 rounded-full bg-[var(--bg2)] text-sm">${esc(t)}</span>`).join('')}
            </div>
          </div>
          <div>
            <div class="section-title">简介</div>
            <p class="leading-relaxed mt-1 text-base">${esc(c.description)}</p>
          </div>
        </div>
        <!-- Right: Stats & Quick Info -->
        <div>
          <div class="grid grid-cols-3 gap-2 mb-4">
            ${stats.map(s => `<div class="stat-card card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('')}
          </div>
          ${c.quotes.length ? `
          <div class="quote-block serif mb-4">
            <p class="italic text-[var(--accent)] text-lg pl-4">"${c.quotes[0]}"</p>
            ${c.quotes.length > 1 ? `<p class="text-xs text-[var(--muted)] mt-2 pl-4">共 ${c.quotes.length} 条名言</p>` : ''}
          </div>` : ''}
          <div class="card">
            <div class="section-title">所属时期</div>
            <p class="font-medium">${esc(c.period || '不详')}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Life Timeline -->
    ${evs.length > 0 ? `
    <div class="panel p-8 mb-6">
      <div class="section-title" style="font-size:1rem;">人生大事</div>
      <div class="flex justify-between items-center mb-4">
        <span class="text-sm text-[var(--muted)]">按时间排列的关键事件</span>
        <a href="timeline.html" class="text-sm text-[var(--accent)] hover:underline">查看完整时间轴 →</a>
      </div>
      ${renderLifeTimeline(c.name, evs)}
    </div>` : ''}

    <!-- More Quotes -->
    ${c.quotes.length > 1 ? `
    <div class="panel p-8 mb-6">
      <div class="section-title" style="font-size:1rem;">名言警句</div>
      <div class="space-y-3 mt-2">
        ${c.quotes.map(q => `
          <div class="quote-block serif">
            <p class="italic text-[var(--accent)] text-lg pl-4">"${esc(q)}"</p>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <!-- Related Idioms -->
    ${idioms.length > 0 ? `
    <div class="panel p-8 mb-6">
      <div class="flex justify-between items-center mb-4">
        <div class="section-title" style="font-size:1rem;">相关典故</div>
        <a href="idioms.html" class="text-sm text-[var(--accent)] hover:underline">查看全部典故 →</a>
      </div>
      <div class="grid md:grid-cols-2 gap-3">
        ${idioms.map(idiom => `
          <div class="card cursor-pointer" onclick="location.href='detail.html?type=idiom&name=${encodeURIComponent(idiom.idiom)}'">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold serif text-[var(--accent)]">${esc(idiom.idiom)}</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-[var(--bg2)]">${esc(idiom.pinyin)}</span>
            </div>
            <p class="text-sm text-[var(--muted)]">${esc(idiom.meaning)}</p>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <!-- Relationships -->
    ${rels.length > 0 ? `
    <div class="panel p-8 mb-6">
      <div class="flex justify-between items-center mb-4">
        <div class="section-title" style="font-size:1rem;">人物关系</div>
        <a href="graph.html" class="text-sm text-[var(--accent)] hover:underline">查看关系图谱 →</a>
      </div>
      <div class="space-y-2">
        ${rels.map(r => {
          const otherName = r.source === c.name ? r.target : r.source;
          const other = allData.characters.find(x => x.name === otherName);
          return `<div class="card flex items-center gap-3">
            <span class="px-2 py-0.5 rounded text-xs bg-[var(--accent)]/10 text-[var(--accent)] whitespace-nowrap">${esc(r.type)}</span>
            ${other ? `<a href="detail.html?type=character&id=${other.id}" class="font-medium hover:text-[var(--accent)] transition">${esc(otherName)}</a>` : `<span class="font-medium">${otherName}</span>`}
            ${r.description ? `<span class="text-sm text-[var(--muted)] truncate">${esc(r.description)}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <!-- Related Events Grid -->

// Arrow key navigation for detail page (left/right to browse items)
document.addEventListener('keydown', function(e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  // Don't trigger when typing in input/select/textarea
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  // Only allow when data is loaded
  if (!allData.characters || !allData.characters.length) return;

  var params = new URLSearchParams(location.search);
  var curType = params.get('type');
  var curId = params.get('id');
  var list = [];

  if (curType === 'character' && allData.characters) list = allData.characters;
  else if (curType === 'event' && allData.events) list = allData.events;
  else if (curType === 'location' && allData.locations) list = allData.locations;
  else if (curType === 'idiom' && allData.idioms) list = allData.idioms;

  if (list.length === 0 || !curId) return;

  var idx = list.findIndex(function(item) { return item.id === curId; });
  if (idx < 0) return;

  if (e.key === 'ArrowLeft' && idx > 0) {
    e.preventDefault();
    var prevId = list[idx - 1].id;
    if (curType === 'idiom') {
      location.href = 'detail.html?type=' + curType + '&id=' + prevId;
    } else {
      location.href = 'detail.html?type=' + curType + '&id=' + prevId;
    }
  } else if (e.key === 'ArrowRight' && idx < list.length - 1) {
    e.preventDefault();
    var nextId = list[idx + 1].id;
    if (curType === 'idiom') {
      location.href = 'detail.html?type=' + curType + '&id=' + nextId;
    } else {
      location.href = 'detail.html?type=' + curType + '&id=' + nextId;
    }
  }
});

<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
