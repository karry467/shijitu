          <div class="text-xs text-[var(--muted)]" id="eventCount"></div>
        </div>
        <!-- Time Range Filter -->
        <div class="flex items-center gap-3 mb-6 pb-4 border-b border-[var(--rule)]">
          <span class="text-xs text-[var(--muted)] whitespace-nowrap">时间范围:</span>
          <input type="range" id="yearStart" min="-2700" max="200" value="-2700" class="flex-1 h-1.5 rounded-lg appearance-none cursor-pointer accent-[var(--accent)]">
          <input type="range" id="yearEnd" min="-2700" max="200" value="200" class="flex-1 h-1.5 rounded-lg appearance-none cursor-pointer accent-[var(--accent)]">
          <span id="yearLabel" class="text-xs text-[var(--muted)] whitespace-nowrap min-w-[120px]"></span>
          <button id="resetRange" class="text-xs px-2 py-1 rounded border border-[var(--rule)] text-[var(--muted)] hover:border-[var(--accent)] hover:text-[var(--accent)] transition">重置</button>
        </div>
        <div id="timelineList" class="space-y-6"></div>
      </div>
    </div>

    <!-- Chart & Detail -->
    <div class="w-full lg:w-96 space-y-4 lg:sticky lg:top-24 lg:self-start lg:max-h-[calc(100vh-120px)] lg:overflow-y-auto">
      <div class="panel p-4">
        <h3 class="font-bold serif mb-3 text-sm">时间分布图</h3>
        <div id="timelineChart" style="width:100%;height:280px;"></div>
      </div>

      <div class="panel p-5" id="detailPanel" style="display:none;">
        <div class="flex items-center gap-2 mb-3">
          <span id="detailBadge" class="text-xs px-2 py-0.5 rounded font-medium"></span>
          <span id="detailDate" class="text-xs text-[var(--muted)]"></span>
        </div>
        <h3 class="font-bold serif text-lg mb-2" id="detailTitle"></h3>
        <p class="text-sm text-[var(--muted)] leading-relaxed mb-4" id="detailDesc"></p>
        <div class="space-y-3 text-sm">
          <div><strong class="text-[var(--muted)]">结果</strong><p id="detailOutcome"></p></div>
          <div><strong class="text-[var(--muted)]">历史意义</strong><p id="detailSignificance"></p></div>
          <div><strong class="text-[var(--muted)]">相关人物</strong>
            <div class="flex flex-wrap gap-2 mt-1" id="detailChars"></div>
          </div>
          <div class="pt-3 border-t border-[var(--rule)]">
            <strong class="text-[var(--muted)] text-xs">史记原文</strong>
            <p class="italic text-[var(--accent)] mt-1 text-sm leading-relaxed" id="detailQuote"></p>
          </div>
        </div>
      </div>

      <div class="panel p-5" id="emptyPanel">
        <div class="text-center text-[var(--muted)]">
          <svg class="w-10 h-10 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <p class="text-sm">点击左侧时间轴事件<br>查看详细信息</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
let allData = {}, currentChapter = 'all', searchQuery = '', yearStart = -2700, yearEnd = 200;
const chapterNames = { wudi: '五帝本纪', xia: '夏本纪', yin: '殷本纪', zhou: '周本纪', qinshi: '秦始皇本纪', xiangyu: '项羽本纪', gaozu: '高祖本纪', lvhou: '吕太后本纪', kongzi: '孔子世家', cheshe: '陈涉世家', cike: '刺客列传', lianpo: '廉颇蔺相如列传', wuyue: '越王勾践世家', shangjun: '商君列传', weigongzi: '魏公子列传', liguang: '李将军列传', qitaigong: '齐太公世家', guanyan: '管晏列传', liuhou: '留侯世家', huaiyinhou: '淮阴侯列传', lu: '鲁周公世家', jin: '晋世家', chu: '楚世家', zhao: '赵世家', sunwuzi: '孙子吴起列传', baiqiwangjian: '白起王翦列传', suqin: '苏秦列传', zhangyi: '张仪列传', mengzi_xunzi: '孟子荀卿列传', xiongnu: '匈奴列传', lisi: '李斯列传', mengtian: '蒙恬列传', wei: '魏世家', han: '韩世家', yan: '燕世家', tianqi: '田敬仲完世家', wutaibo: '吴太伯世家', zheng: '郑世家', song: '宋微子世家', wei_kangshu: '卫康叔世家', fanju_caize: '范雎蔡泽列传', yueyi: '乐毅列传', quyuan_jiasheng: '屈原贾生列传', lvbuwei: '吕不韦列传', qin_benji: '秦本纪', cai: '蔡世家', cao: '曹世家', chenqi: '陈杞世家', waiqi: '外戚世家', ranghou: '穰侯列传', mengchangjun: '孟尝君列传', pingyuanjun: '平原君虞卿列传', chunshenjun: '春申君列传', tiandan: '田单列传', luzhonglian: '鲁仲连邹阳列传', lisheng_lujia: '郦生陆贾列传', zhangchengxiang: '张丞相列传', liujing_shusuntong: '刘敬叔孙通列传', yuanang_chaocuo: '袁盎晁错列传' , xiaowen: '孝文本纪', xiaojing: '孝景本纪', xiaowu: '孝武本纪', liangxiaowang: '梁孝王世家', wuzong: '五宗世家', sanwang: '三王世家', jibu_luanbu: '季布栾布列传', fengtang: '冯唐列传', wanshi: '万石张叔列传', tianshu: '田叔列传', bianque: '扁鹊仓公列传', wuwangbi: '吴王濞列传', weiqi_wuanhou: '魏其武安侯列传', hanchangru: '韩长孺列传', weijiangjun: '卫将军骠骑列传', pingjinhou: '平津侯主父列传', nanyue: '南越列传', dongyue: '东越列传', chaoxian: '朝鲜列传', xinanyi: '西南夷列传', xiaochu: '萧相国世家', caoxiangguo: '曹相国世家', huainan_hengshan_jishan: '淮南衡山济北王列传', qianhouchushu: '循吏列传', lihai_zhichun: '酷吏列传', dayuanyoushi: '大宛列传', youyu: '游侠列传', hongyan: '佞幸列传', shiji_jingzhong: '滑稽列传', rizhualie: '日者列传', huozhilie: '货殖列传', wuzilie: '伍子胥列传', zhonglishu: '仲尼弟子列传', meigeng: '樗里子甘茂列传'
};
const eventColors = { wudi: '#8B6914', xia: '#B8860B', yin: '#CD7F32', zhou: '#2E8B57', kongzi: '#20B2AA', cike: '#3CB371', lianpo: '#228B22', wuyue: '#8B4513', shangjun: '#4A6741', weigongzi: '#6B4226', qinshi: '#4a4a4a', cheshe: '#696969', xiangyu: '#B4462A', gaozu: '#4169E1', lvhou: '#6A5ACD', liguang: '#4A6FA5', qitaigong: '#2F4F4F', guanyan: '#556B2F', liuhou: '#4682B4', huaiyinhou: '#8B008B', lu: '#8B0000', jin: '#800080', chu: '#006400', zhao: '#FF8C00', sunwuzi: '#8B5A2B', baiqiwangjian: '#A0522D', suqin: '#CD853F', zhangyi: '#DAA520', mengzi_xunzi: '#6B8E23', xiongnu: '#708090', lisi: '#5F9EA0', mengtian: '#008B8B', wei: '#8B4513', han: '#A52A2A', yan: '#483D8B', tianqi: '#008080', wutaibo: '#800000', zheng: '#D2691E', song: '#B22222', wei_kangshu: '#9932CC', fanju_caize: '#6495ED', yueyi: '#DC143C', quyuan_jiasheng: '#1E90FF', lvbuwei: '#FF6347', qin_benji: '#4B0082', cai: '#9400D3', cao: '#FF1493', chenqi: '#00CED1', waiqi: '#FF4500', ranghou: '#7FFFD4', mengchangjun: '#F0E68C', pingyuanjun: '#DDA0DD', chunshenjun: '#98FB98', tiandan: '#F4A460', luzhonglian: '#87CEEB', lisheng_lujia: '#FFB6C1', zhangchengxiang: '#B0C4DE', liujing_shusuntong: '#FFD700', yuanang_chaocuo: '#FF69B4' , xiaowen: '#556B2F', xiaojing: '#8FBC8F', xiaowu: '#CD5C5C', liangxiaowang: '#DEB887', wuzong: '#D2B48C', sanwang: '#BC8F8F', jibu_luanbu: '#778899', fengtang: '#708090', wanshi: '#BDB76B', tianshu: '#8B8378', bianque: '#20B2AA', wuwangbi: '#CD5C5C', weiqi_wuanhou: '#9370DB', hanchangru: '#6B8E23', weijiangjun: '#B22222', pingjinhou: '#A0522D', nanyue: '#2E8B57', dongyue: '#3CB371', chaoxian: '#4682B4', xinanyi: '#5F9EA0', xiaochu: '#2F4F4F', caoxiangguo: '#556B2F', huainan_hengshan_jishan: '#8B008B', qianhouchushu: '#698B22', lihai_zhichun: '#8B0000', dayuanyoushi: '#B8860B', youyu: '#A52A2A', hongyan: '#CD5C5C', shiji_jingzhong: '#20B2AA', rizhualie: '#778899', huozhilie: '#DAA520', wuzilie: '#4169E1', zhonglishu: '#228B22', meigeng: '#708090'
, peng_yue_lie: '彭越列传', ying_bu_lie: '英布列传', tai_shi_gong: '太史公自序', he_shu: '河渠书', pingzhun_shu: '平准书', fengshan_shu: '封禅书'
};
function chapterName(ch) { return chapterNames[ch] || ch; }

function showError(msg) {
  document.getElementById('timelineList').innerHTML = '<div class="text-center text-[var(--accent)] py-20">' + msg + '</div>';
}

async function loadData() {
  try {
    const [events, chapters] = await Promise.all([
      fetch('data/events.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; }),
      fetch('data/chapters.json').then(function(r) { if (!r.ok) throw new Error('加载失败'); return r.json(); }).catch(function(e) { console.error(e); return []; })
    ]);
    allData = { events, chapters };

    const params = new URLSearchParams(location.search);
    const ch = params.get('chapter') || localStorage.getItem('selectedChapter') || 'all';
    currentChapter = ch;
    document.getElementById('chapterSelect').value = ch;

    render();
    renderChart();
  } catch (e) {
    console.error(e);
    showError('数据加载失败，请刷新页面重试');
  }
}

function getFilteredEvents() {
  let evs = [...allData.events].sort((a, b) => a.year - b.year);
  if (currentChapter !== 'all') evs = evs.filter(e => e.chapter === currentChapter);
  // Time range filter
  evs = evs.filter(e => e.year >= yearStart && e.year <= yearEnd);
  // Search filter
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    evs = evs.filter(e =>
      e.name.toLowerCase().includes(q) ||
      e.description.toLowerCase().includes(q) ||
      (e.characters && e.characters.some(c => c.toLowerCase().includes(q))) ||
      (e.locationName && e.locationName.toLowerCase().includes(q))
    );
  }
  return evs;
}

function updateYearLabel() {
  const fmt = y => y < 0 ? `公元前${Math.abs(y)}年` : (y === 0 ? '公元元年' : `公元${y}年`);
  document.getElementById('yearLabel').textContent = `${fmt(yearStart)} — ${fmt(yearEnd)}`;
}

function render() {
  const evs = getFilteredEvents();
  document.getElementById('eventCount').textContent = `共 ${evs.length} 个事件`;

  const container = document.getElementById('timelineList');
  container.innerHTML = evs.map((e, i) => `
    <div class="timeline-item ${i === 0 ? 'active' : ''} cursor-pointer hover:bg-[var(--bg)] -mx-2 px-4 py-2 rounded-lg transition" data-id="${e.id}" onclick="showDetail('${e.id}')">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-lg font-bold serif text-[var(--accent)]">${esc(e.date)}</span>
        <span class="chapter-badge-${e.chapter} text-xs px-2 py-0.5 rounded font-medium">${chapterName(e.chapter)}</span>
      </div>
      <h3 class="font-bold text-base mb-1">${esc(e.name)}</h3>
      <p class="text-sm text-[var(--muted)] line-clamp-2">${esc(e.description)}</p>
      <div class="flex flex-wrap gap-1 mt-2">
        ${e.characters.slice(0,4).map(c => `<span class="text-xs px-2 py-0.5 rounded bg-[var(--bg2)] text-[var(--muted)]">${esc(c)}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function showDetail(id) {
  const e = allData.events.find(x => x.id === id);
  if (!e) return;

  document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`)?.classList.add('active');

  document.getElementById('emptyPanel').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'block';

  const badge = document.getElementById('detailBadge');
  badge.className = `text-xs px-2 py-0.5 rounded font-medium chapter-badge-${e.chapter}`;
  badge.textContent = chapterName(e.chapter);

  document.getElementById('detailDate').textContent = e.date;
  document.getElementById('detailTitle').textContent = e.name;
  document.getElementById('detailDesc').textContent = e.description;
  document.getElementById('detailOutcome').textContent = e.outcome;
  document.getElementById('detailSignificance').textContent = e.significance;
  document.getElementById('detailQuote').textContent = e.quote;
  document.getElementById('detailChars').innerHTML = e.characters.map(c =>
    `<span class="text-xs px-2 py-0.5 rounded bg-[var(--accent)]/10 text-[var(--accent)] cursor-pointer hover:bg-[var(--accent)]/20" onclick="viewChar('${c}')">${esc(c)}</span>`
  ).join('');
}

function viewChar(name) {
  window.location.href = 'graph.html?char=' + encodeURIComponent(name);
}

function renderChart() {
  const evs = getFilteredEvents();
  const chart = echarts.init(document.getElementById('timelineChart'));
  const data = evs.map(e => [e.year, e.name, e.chapter]);

  chart.setOption({
    tooltip: {
      formatter: p => {
        const ev = allData.events.find(e => e.name === p.data.value[1]);
        if (!ev) return `${p.data[1]}<br/>${Math.abs(p.data[0])}年${p.data[0] < 0 ? ' BC' : ''}`;
        return `<strong style="font-size:14px">${esc(ev.name)}</strong><br/>${esc(ev.date)}${ev.locationName ? ` · ${esc(ev.locationName)}` : ''}` +
          (ev.description ? `<br/><span style="font-size:12px;display:inline-block;margin-top:4px;max-width:260px">${esc(ev.description.substring(0, 60))}${ev.description.length > 60 ? '...' : ''}</span>` : '') +
          (ev.significance ? `<br/><span style="font-size:11px;color:#8B7E6A">${esc(ev.significance.substring(0, 50))}${ev.significance.length > 50 ? '...' : ''}</span>` : '');
      }
    },
    xAxis: {
      type: 'value',
      min: value => Math.floor(value.min - 10),
      max: value => Math.ceil(value.max + 10),
      axisLabel: {
        formatter: v => `${Math.abs(v)}${v < 0 ? ' BC' : ' AD'}`,
        fontSize: 10
      },
      splitLine: { lineStyle: { color: '#eee' } }
    },
    yAxis: { type: 'category', data: evs.map(e => e.name), axisLabel: { fontSize: 10 } },
    series: [{
      type: 'scatter',
      data: evs.map(e => ({
        value: [e.year, e.name],
        itemStyle: { color: eventColors[e.chapter] || '#8B7E6A' }
      })),
      symbolSize: 14,
      emphasis: { scale: 1.5 }
    }],
    grid: { left: 80, right: 20, top: 20, bottom: 30 }
  });

  chart.on('click', params => {
    const ev = allData.events.find(e => e.name === params.data.value[1]);
    if (ev) showDetail(ev.id);
  });
}

document.getElementById('chapterSelect').addEventListener('change', e => {
  currentChapter = e.target.value;
  render();
  renderChart();
});

// Search
const tlSearchInput = document.getElementById('timelineSearch');
let tlSearchDebounce;
tlSearchInput.addEventListener('input', e => {
  clearTimeout(tlSearchDebounce);
  tlSearchDebounce = setTimeout(() => {
    searchQuery = e.target.value.trim();
    render();
    renderChart();
  }, 200);
});

// Time range sliders
const yearStartEl = document.getElementById('yearStart');
const yearEndEl = document.getElementById('yearEnd');
function onYearChange() {
  yearStart = parseInt(yearStartEl.value);
  yearEnd = parseInt(yearEndEl.value);
  if (yearStart > yearEnd) { yearEnd = yearStart; yearEndEl.value = yearEnd; }
  updateYearLabel();
  render();
  renderChart();
}
yearStartEl.addEventListener('input', onYearChange);
yearEndEl.addEventListener('input', onYearChange);
document.getElementById('resetRange').addEventListener('click', () => {
  yearStartEl.value = -2700; yearEndEl.value = 200;
  yearStart = -2700; yearEnd = 200;
  updateYearLabel();
  render();
  renderChart();
});
updateYearLabel();

// Filter out "-重复" options from dropdown
document.querySelectorAll('#chapterSelect option').forEach(function(opt) {
  if (opt.value !== 'all' && opt.textContent.endsWith('-重复')) {
    opt.style.display = 'none';
  }
});

loadData();
</script>
<script src="shortcuts.js"></script>
<script src="theme.js?v=2"></script>
<div id="toast" class="toast"></div>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
